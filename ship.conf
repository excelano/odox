# Values ship reads. The prose is in RELEASE.md; the loop is in
# ~/notes/releasing.md. Format and keys: anderix/ship, docs/PROFILE.md.
loop=hand-cut
version_file=Cargo.toml
apt_package=odox
deb_packages=4
deb_arches=amd64 arm64
# `odox` last: it depends on `odox-core` and nothing depends on it.
crates=odox-core odox-ui xodt xods xodp odox
commands=xodt xods xodp odox
homebrew=no
winget=
store_lanes=
display_name=odox
packages_workflow=linux.yml
