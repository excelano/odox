# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.15.2"

[products.xodt.locales.en-us]
whats-new = "This release changes only Odox Grid. Odox Text is the same as in 0.15.1."

[products.xodt.locales.de-de]
whats-new = "Diese Version ändert nur Odox Grid. Odox Text ist unverändert gegenüber 0.15.1."

[products.xods.locales.en-us]
whats-new = "Formulas now come to LibreOffice's answers in many more cases. Text such as 1,000, 5/1/2024 or 9:30 pm counts as a number in arithmetic. SUMIF, COUNTIF and VLOOKUP match their criteria as wildcards or regular expressions, as the document's settings say. Numbers joined to text, dates before 1583 and the errors for a wrong argument match LibreOffice's."

[products.xods.locales.de-de]
whats-new = "Formeln kommen jetzt in vielen weiteren Fällen auf die Ergebnisse von LibreOffice. Text wie 1,000, 5/1/2024 oder 9:30 pm zählt in Rechnungen als Zahl. SUMIF, COUNTIF und VLOOKUP werten ihre Kriterien als Platzhalter oder reguläre Ausdrücke aus, wie es die Einstellungen des Dokuments vorsehen. Mit Text verbundene Zahlen, Daten vor 1583 und die Fehler bei einem falschen Argument stimmen mit LibreOffice überein."

[products.xodp.locales.en-us]
whats-new = "This release changes only Odox Grid. Odox Deck is the same as in 0.15.1."

[products.xodp.locales.de-de]
whats-new = "Diese Version ändert nur Odox Grid. Odox Deck ist unverändert gegenüber 0.15.1."
