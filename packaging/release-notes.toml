# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.16.0"

[products.xodt.locales.en-us]
whats-new = "Hebrew and Arabic now read in the right order, mixed with other text on the same line, in the window and in exported PDFs. A character the document's font lacks is drawn in a face of the same weight and slant, bold or italic where the text is."

[products.xodt.locales.de-de]
whats-new = "Hebräisch und Arabisch erscheinen jetzt in der richtigen Reihenfolge, auch gemischt mit anderem Text in derselben Zeile, im Fenster und in exportierten PDFs. Ein Zeichen, das der Schrift des Dokuments fehlt, wird in einer Schrift derselben Stärke und Lage gezeichnet, fett oder kursiv, wo der Text es ist."

[products.xods.locales.en-us]
whats-new = "Hebrew and Arabic in cells now read in the right order. LOWER leaves a dotted capital I as it is, as LibreOffice does. A character the document's font lacks is drawn in a face of the same weight and slant."

[products.xods.locales.de-de]
whats-new = "Hebräisch und Arabisch in Zellen erscheinen jetzt in der richtigen Reihenfolge. LOWER lässt ein großes İ mit Punkt unverändert, wie LibreOffice. Ein Zeichen, das der Schrift des Dokuments fehlt, wird in einer Schrift derselben Stärke und Lage gezeichnet."

[products.xodp.locales.en-us]
whats-new = "Slides now show tiled picture fills, radial, elliptical, square and rectangular gradients, the text in a turned shape, and dimension lines with their arrows and lengths, in the window and in exported PDFs. Hebrew and Arabic read in the right order."

[products.xodp.locales.de-de]
whats-new = "Folien zeigen jetzt gekachelte Bildfüllungen, radiale, elliptische, quadratische und rechteckige Verläufe, den Text in gedrehten Formen und Maßlinien mit Pfeilen und Längen, im Fenster und in exportierten PDFs. Hebräisch und Arabisch erscheinen in der richtigen Reihenfolge."
