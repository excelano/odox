# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.6.0"

[products.xodt.locales.en-us]
whats-new = "Replace: Ctrl+H replaces the current match or every match, as one step to undo. A Format menu offers bold, italic, underline, strikethrough, headings and lists by name. Text you copy and paste inside the window keeps its formatting. Enter at the end of a heading starts body text, and a drag past the last paragraph selects to its end. The page's paragraphs and headings are now exposed to assistive technology."

[products.xodt.locales.de-de]
whats-new = "Ersetzen: Strg+H ersetzt den aktuellen Treffer oder alle Treffer, in einem Schritt rückgängig zu machen. Ein Menü Format bietet Fett, Kursiv, Unterstrichen, Durchgestrichen, Überschriften und Listen mit Namen an. Text, den Sie im Fenster kopieren und einfügen, behält seine Formatierung. Enter am Ende einer Überschrift beginnt einen Fließtext, und ein Ziehen über den letzten Absatz hinaus markiert bis zu seinem Ende. Absätze und Überschriften der Seite stehen jetzt Hilfstechnologien zur Verfügung."

[products.xods.locales.en-us]
whats-new = "Insert and delete rows and columns from the new Sheet menu: formulas that name the cells it moves follow them, and a change that would break one is refused with the reason. Ctrl+H replaces text in the cells that hold text and says how many it left. The arrow keys now walk past the data into the empty grid."

[products.xods.locales.de-de]
whats-new = "Zeilen und Spalten einfügen und löschen im neuen Menü Blatt: Formeln, die auf die verschobenen Zellen verweisen, folgen ihnen, und eine Änderung, die eine zerstören würde, wird mit Begründung abgelehnt. Strg+H ersetzt Text in den Zellen mit Text und sagt, wie viele es ausgelassen hat. Die Pfeiltasten gehen jetzt über die Daten hinaus in das leere Gitter."

[products.xodp.locales.en-us]
whats-new = "A Slide menu duplicates, moves and deletes slides, each one step to undo. Ctrl+H replaces text across the slides and their notes. A link in a slide's text goes to the slide it names. A Format menu offers bold, italic, underline and strikethrough, and text you copy and paste inside the window keeps its formatting."

[products.xodp.locales.de-de]
whats-new = "Ein Menü Folie dupliziert, verschiebt und löscht Folien, jedes in einem Schritt rückgängig zu machen. Strg+H ersetzt Text in den Folien und ihren Notizen. Ein Verweis im Text einer Folie führt zur Folie, die er nennt. Ein Menü Format bietet Fett, Kursiv, Unterstrichen und Durchgestrichen an, und Text, den Sie im Fenster kopieren und einfügen, behält seine Formatierung."
