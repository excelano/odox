# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.14.0"

[products.xodt.locales.en-us]
whats-new = "Exported PDFs now place tabs at the paragraph's tab stops, with dot leaders, as the window does. The caret before a tab sits where it belongs, Replace moves on to the next match, and Tab in a table that cannot grow says why."

[products.xodt.locales.de-de]
whats-new = "Exportierte PDFs setzen Tabulatoren jetzt an die Tabstopps des Absatzes, mit Füllzeichen, wie das Fenster. Die Schreibmarke vor einem Tabulator steht an der richtigen Stelle, Ersetzen geht zum nächsten Treffer weiter, und die Tabulatortaste in einer Tabelle, die nicht wachsen kann, sagt, warum."

[products.xods.locales.en-us]
whats-new = "Format cells with Sheet > Format cells or Ctrl+1: number format, bold, italic, underline, colours, alignment, wrapping and borders, and Ctrl+B, Ctrl+I and Ctrl+U on a selection. Formulas, rounding and number formats now agree with LibreOffice, sort and fill keep links and bold, and large sorts and fills are much faster."

[products.xods.locales.de-de]
whats-new = "Zellen formatieren mit Blatt > Zellen formatieren oder Strg+1: Zahlenformat, fett, kursiv, unterstrichen, Farben, Ausrichtung, Zeilenumbruch und Rahmen, dazu Strg+B, Strg+I und Strg+U auf einer Auswahl. Formeln, Rundung und Zahlenformate stimmen jetzt mit LibreOffice überein, Sortieren und Ausfüllen behalten Links und Fettdruck, und große Bereiche sind deutlich schneller."

[products.xodp.locales.en-us]
whats-new = "A new slide's title now types in the same size as the title before it. Tabs in exported PDFs go to the paragraph's tab stops, and Replace moves on to the next match."

[products.xodp.locales.de-de]
whats-new = "Der Titel einer neuen Folie hat jetzt dieselbe Größe wie der Titel davor. Tabulatoren in exportierten PDFs gehen zu den Tabstopps des Absatzes, und Ersetzen geht zum nächsten Treffer weiter."
