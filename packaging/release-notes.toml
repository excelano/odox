# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.11.0"

[products.xodt.locales.en-us]
whats-new = "Documents open fitted to the width of the window, and 100% now shows a page at its printed size. Ctrl with the mouse wheel zooms and keeps your place in the document. The outline starts hidden; View > Show the side panel brings it back."

[products.xodt.locales.de-de]
whats-new = "Dokumente öffnen sich an die Fensterbreite angepasst, und 100 % zeigt eine Seite jetzt in Druckgröße. Strg mit dem Mausrad zoomt und behält dabei die Stelle im Dokument bei. Die Gliederung ist anfangs ausgeblendet; Ansicht > Seitenleiste anzeigen blendet sie wieder ein."

[products.xods.locales.en-us]
whats-new = "100% now shows a sheet at its printed size, and Ctrl with the mouse wheel zooms."

[products.xods.locales.de-de]
whats-new = "100 % zeigt eine Tabelle jetzt in Druckgröße, und Strg mit dem Mausrad zoomt."

[products.xodp.locales.en-us]
whats-new = "Presentations open fitted to the window, and 100% now shows a slide at its printed size. Ctrl with the mouse wheel zooms; View > Fit to the window fits it again."

[products.xodp.locales.de-de]
whats-new = "Präsentationen öffnen sich an das Fenster angepasst, und 100 % zeigt eine Folie jetzt in Druckgröße. Strg mit dem Mausrad zoomt; Ansicht > An das Fenster anpassen passt sie wieder an."
