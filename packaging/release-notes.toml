# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.19.0"

[products.xodt.locales.en-us]
whats-new = "Odox Text now writes as well as reads. Insert tables, pictures with a description, footnotes and endnotes, comments, links, page breaks, page numbers and dates; give the page a header and a footer and set its paper and margins. Set the font, size, colour and highlight, raise or lower text, align, indent and space paragraphs, and use ten heading levels and nested lists. Tracked changes are shown in their authors' colours and can be accepted or rejected. Find can match case and whole words, the bar under the page counts words, spelling is checked as you type, File > Print prints, and a copy of unsaved changes is kept against a crash."

[products.xodt.locales.de-de]
whats-new = "Odox Text schreibt jetzt so gut, wie es liest. Fügen Sie Tabellen ein, Bilder mit Beschreibung, Fuß- und Endnoten, Kommentare, Links, Seitenumbrüche, Seitenzahlen und Datumsangaben; geben Sie der Seite Kopf- und Fußzeile, Papier und Ränder. Setzen Sie Schriftart, Größe, Farbe und Hervorhebung, stellen Sie Text hoch oder tief, richten Sie Absätze aus, rücken Sie sie ein und setzen Sie ihren Abstand, mit zehn Überschriftsebenen und verschachtelten Listen. Nachverfolgte Änderungen erscheinen in den Farben ihrer Autoren und lassen sich annehmen oder ablehnen. Die Suche beachtet auf Wunsch Groß- und Kleinschreibung und ganze Wörter, die Leiste unter der Seite zählt Wörter, die Rechtschreibung wird beim Tippen geprüft, Datei > Drucken druckt, und ungespeicherte Änderungen werden gegen einen Absturz bereitgehalten."

[products.xods.locales.en-us]
whats-new = "Odox Grid now works out formulas as you type them, with many more functions, and works them out again when a cell they read changes. Conditional formats colour cells while their conditions hold, a cell's validity rule is checked as a value goes in, and pictures and shapes on a sheet are drawn over its cells. A range refused for a merged cell now says so. Find can match case and whole words, spelling is checked in the cell you are typing in, File > Print prints, and a copy of unsaved changes is kept against a crash."

[products.xods.locales.de-de]
whats-new = "Odox Grid rechnet Formeln jetzt beim Tippen aus, mit vielen weiteren Funktionen, und rechnet sie neu, sobald sich eine Zelle ändert, die sie lesen. Bedingte Formatierungen färben Zellen, solange ihre Bedingung gilt, die Gültigkeitsregel einer Zelle wird bei der Eingabe geprüft, und Bilder und Formen eines Blatts werden über seine Zellen gezeichnet. Ein Bereich, der wegen einer verbundenen Zelle abgelehnt wird, sagt das jetzt. Die Suche beachtet auf Wunsch Groß- und Kleinschreibung und ganze Wörter, die Rechtschreibung wird in der Zelle geprüft, in die Sie tippen, Datei > Drucken druckt, und ungespeicherte Änderungen werden gegen einen Absturz bereitgehalten."

[products.xodp.locales.en-us]
whats-new = "Odox Deck can now put a text box, a picture with a description, or a comment on a slide from the Slide menu, and set a label's font, size, colour, highlight and alignment. The slideshow reveals a slide's builds click by click, and shapes draw their shadows. Find can match case and whole words, spelling is checked as you type, File > Print prints, and a copy of unsaved changes is kept against a crash."

[products.xodp.locales.de-de]
whats-new = "Odox Deck setzt jetzt über das Menü Folie ein Textfeld, ein Bild mit Beschreibung oder einen Kommentar auf eine Folie und setzt Schriftart, Größe, Farbe, Hervorhebung und Ausrichtung einer Beschriftung. Die Bildschirmpräsentation zeigt die Animationen einer Folie Klick für Klick, und Formen werfen ihre Schatten. Die Suche beachtet auf Wunsch Groß- und Kleinschreibung und ganze Wörter, die Rechtschreibung wird beim Tippen geprüft, Datei > Drucken druckt, und ungespeicherte Änderungen werden gegen einen Absturz bereitgehalten."
