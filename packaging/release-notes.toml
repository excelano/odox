# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.20.0"

[products.xodt.locales.en-us]
whats-new = "Every menu is reached from the keyboard: Alt and a menu's underlined letter opens it, and an entry's underlined letter chooses it. A field cut from a header and pasted into the body stays a field. On Linux the print dialog opens over the window, and a document with nothing to print says so."

[products.xodt.locales.de-de]
whats-new = "Jedes Menü ist mit der Tastatur erreichbar: Alt und der unterstrichene Buchstabe öffnen ein Menü, und der unterstrichene Buchstabe eines Eintrags wählt ihn. Ein aus der Kopfzeile ausgeschnittenes und in den Text eingefügtes Feld bleibt ein Feld. Unter Linux öffnet sich der Druckdialog über dem Fenster, und ein Dokument ohne druckbaren Inhalt sagt das."

[products.xods.locales.en-us]
whats-new = "Every menu is reached from the keyboard: Alt and a menu's underlined letter opens it, and an entry's underlined letter chooses it. INDEX with no column, MATCH and HLOOKUP over a range holding an error, and seconds in a time and in TEXT now answer as LibreOffice does. On Linux the print dialog opens over the window, and a document with nothing to print says so."

[products.xods.locales.de-de]
whats-new = "Jedes Menü ist mit der Tastatur erreichbar: Alt und der unterstrichene Buchstabe öffnen ein Menü, und der unterstrichene Buchstabe eines Eintrags wählt ihn. INDEX ohne Spalte, MATCH und HLOOKUP über einen Bereich mit einem Fehler sowie Sekunden in einer Uhrzeit und in TEXT ergeben jetzt dasselbe wie in LibreOffice. Unter Linux öffnet sich der Druckdialog über dem Fenster, und ein Dokument ohne druckbaren Inhalt sagt das."

[products.xodp.locales.en-us]
whats-new = "Every menu is reached from the keyboard: Alt and a menu's underlined letter opens it, and an entry's underlined letter chooses it. A misspelled word on a turned label offers its corrections on a right click. On Linux the print dialog opens over the window, and a document with nothing to print says so."

[products.xodp.locales.de-de]
whats-new = "Jedes Menü ist mit der Tastatur erreichbar: Alt und der unterstrichene Buchstabe öffnen ein Menü, und der unterstrichene Buchstabe eines Eintrags wählt ihn. Ein falsch geschriebenes Wort in einer gedrehten Beschriftung bietet mit einem Rechtsklick seine Korrekturen an. Unter Linux öffnet sich der Druckdialog über dem Fenster, und ein Dokument ohne druckbaren Inhalt sagt das."
