# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.17.0"

[products.xodt.locales.en-us]
whats-new = "Text can now be given a font and a size, and paragraphs aligned left, centered, right or justified. Insert a picture puts a PNG or JPEG into the document and asks what it shows, for someone who cannot see it. Format > Page setup sets the paper, portrait or landscape, and the margins."

[products.xodt.locales.de-de]
whats-new = "Text erhält jetzt eine Schriftart und eine Schriftgröße, Absätze lassen sich links, zentriert, rechts oder im Blocksatz ausrichten. Bild einfügen setzt ein PNG- oder JPEG-Bild ins Dokument und fragt, was es zeigt, für jemanden, der es nicht sehen kann. Format > Seite einrichten legt Papier, Hoch- oder Querformat und die Ränder fest."

[products.xods.locales.en-us]
whats-new = "This release changes only Odox Text and Odox Deck. Odox Grid is the same as in 0.16.0."

[products.xods.locales.de-de]
whats-new = "Diese Version ändert nur Odox Text und Odox Deck. Odox Grid ist unverändert gegenüber 0.16.0."

[products.xodp.locales.en-us]
whats-new = "The text on a slide can now be given a font and a size and aligned left, centered, right or justified. The text in a turned shape can now be edited where it is drawn."

[products.xodp.locales.de-de]
whats-new = "Der Text auf einer Folie erhält jetzt eine Schriftart und eine Schriftgröße und lässt sich links, zentriert, rechts oder im Blocksatz ausrichten. Der Text in einer gedrehten Form lässt sich jetzt dort bearbeiten, wo er steht."
