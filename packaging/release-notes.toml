# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.19.1"

[products.xodt.locales.en-us]
whats-new = "A fix release. The Format menu fits a short window, with the text marks and alignment in submenus, and Promote and Demote heading are offered only on headings. The default font colour is in the colour palette, a styled link is drawn as a link, and words added to the dictionary are taken in capitals and in other open windows, with a failure to keep one shown. A document opened from Finder asks before replacing one with unsaved changes, and an empty window no longer asks to save."

[products.xodt.locales.de-de]
whats-new = "Eine Korrekturversion. Das Menü Format passt in ein niedriges Fenster, mit Zeichenformaten und Ausrichtung in Untermenüs, und Überschrift höher und tiefer stufen werden nur bei Überschriften angeboten. Die voreingestellte Schriftfarbe steht in der Farbpalette, ein formatierter Link wird als Link gezeichnet, und Wörter im Wörterbuch gelten auch in Großbuchstaben und in anderen offenen Fenstern; kann eines nicht gespeichert werden, wird das angezeigt. Ein aus dem Finder geöffnetes Dokument fragt, bevor es eines mit ungespeicherten Änderungen ersetzt, und ein leeres Fenster fragt nicht mehr nach dem Speichern."

[products.xods.locales.en-us]
whats-new = "A fix release. Renaming a sheet whose name has a space keeps its print and conditional-format ranges whole. Words added to the dictionary are taken in capitals and in other open windows, with a failure to keep one shown. A document opened from Finder asks before replacing one with unsaved changes, and an empty window no longer asks to save."

[products.xods.locales.de-de]
whats-new = "Eine Korrekturversion. Wird ein Blatt umbenannt, dessen Name ein Leerzeichen enthält, bleiben seine Druck- und Formatierungsbereiche ganz. Wörter im Wörterbuch gelten auch in Großbuchstaben und in anderen offenen Fenstern; kann eines nicht gespeichert werden, wird das angezeigt. Ein aus dem Finder geöffnetes Dokument fragt, bevor es eines mit ungespeicherten Änderungen ersetzt, und ein leeres Fenster fragt nicht mehr nach dem Speichern."

[products.xodp.locales.en-us]
whats-new = "A fix release. The slideshow passes over hidden slides, follows links to other slides, and Shift+F5 starts it at the slide in view. A link in a label is drawn as a link, and a shadow's outline no longer darkens a ring over its fill. Words added to the dictionary are taken in capitals and in other open windows. A document opened from Finder asks before replacing one with unsaved changes, and an empty window no longer asks to save."

[products.xodp.locales.de-de]
whats-new = "Eine Korrekturversion. Die Bildschirmpräsentation überspringt ausgeblendete Folien, folgt Links zu anderen Folien, und Umschalt+F5 beginnt sie bei der angezeigten Folie. Ein Link in einer Beschriftung wird als Link gezeichnet, und der Umriss eines Schattens dunkelt keinen Ring über seiner Füllung mehr ab. Wörter im Wörterbuch gelten auch in Großbuchstaben und in anderen offenen Fenstern. Ein aus dem Finder geöffnetes Dokument fragt, bevor es eines mit ungespeicherten Änderungen ersetzt, und ein leeres Fenster fragt nicht mehr nach dem Speichern."
