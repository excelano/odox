# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.13.0"

[products.xodt.locales.en-us]
whats-new = "Tabs now go to the paragraph's tab stops, left, right, centred or on the decimal point, with dot leaders as LibreOffice draws them. Text in table cells is inset from the cell borders."

[products.xodt.locales.de-de]
whats-new = "Tabulatoren springen jetzt zu den Tabstopps des Absatzes, links, rechts, zentriert oder am Dezimalzeichen, mit Füllzeichen wie in LibreOffice. Text in Tabellenzellen hat Abstand zum Zellrahmen."

[products.xods.locales.en-us]
whats-new = "Formulas are calculated: type one starting with =, and every cell that depends on a change updates. Fill down and across with Ctrl+D, the Sheet menu or the fill handle, which continues a series. Sheet > Sort sorts a block of rows by a column, and Sheet > Comment adds, changes or deletes a cell's comment. Number format colours, such as red for negatives, now show on screen and in PDFs."

[products.xods.locales.de-de]
whats-new = "Formeln werden berechnet: Geben Sie eine Formel mit = ein, und jede davon abhängige Zelle wird aktualisiert. Füllen Sie nach unten und rechts mit Strg+D, über das Menü Blatt oder mit dem Ausfüllkästchen, das eine Reihe fortsetzt. Blatt > Sortieren sortiert einen Zeilenblock nach einer Spalte, und Blatt > Kommentar fügt einen Zellkommentar hinzu, ändert oder löscht ihn. Farben aus Zahlenformaten, etwa Rot für negative Werte, erscheinen jetzt auf dem Bildschirm und im PDF."

[products.xodp.locales.en-us]
whats-new = "Tabs in slide text now go to the paragraph's tab stops, left, right, centred or on the decimal point, with dot leaders."

[products.xodp.locales.de-de]
whats-new = "Tabulatoren in Folientext springen jetzt zu den Tabstopps des Absatzes, links, rechts, zentriert oder am Dezimalzeichen, mit Füllzeichen."
