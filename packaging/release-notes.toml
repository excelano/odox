# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.18.0"

[products.xodt.locales.en-us]
whats-new = "A picture in a paragraph now stands where the paragraph's alignment puts it: at the left margin, unless the paragraph is centered or right-aligned. A superscript or subscript sits beside the text it belongs to, even on a line with larger text, at the size and height the document gives it, in the window and in an exported PDF, and its highlight moves with it. In the dark theme, highlighted text is drawn in a color that can be read on the highlight."

[products.xodt.locales.de-de]
whats-new = "Ein Bild in einem Absatz steht jetzt dort, wo die Ausrichtung des Absatzes es hinsetzt: am linken Rand, außer der Absatz ist zentriert oder rechtsbündig. Hoch- und tiefgestellter Text steht neben dem Text, zu dem er gehört, auch in einer Zeile mit größerer Schrift, und zwar in der Größe und Höhe, die das Dokument vorgibt, im Fenster wie im exportierten PDF; seine Hervorhebung wandert mit. Im dunklen Design erscheint hervorgehobener Text in einer Farbe, die sich auf der Hervorhebung lesen lässt."

[products.xods.locales.en-us]
whats-new = "Superscript and subscript text in a cell is now drawn at the size the document gives it, in the window and in an exported PDF. In the dark theme, highlighted text is drawn in a color that can be read on the highlight."

[products.xods.locales.de-de]
whats-new = "Hoch- und tiefgestellter Text in einer Zelle erscheint jetzt in der Größe, die das Dokument vorgibt, im Fenster wie im exportierten PDF. Im dunklen Design erscheint hervorgehobener Text in einer Farbe, die sich auf der Hervorhebung lesen lässt."

[products.xodp.locales.en-us]
whats-new = "A superscript or subscript on a slide now sits beside the text it belongs to, at the size and height the document gives it, in the window and in an exported PDF, and its highlight moves with it. Highlighted text is drawn in a color that can be read on the highlight."

[products.xodp.locales.de-de]
whats-new = "Hoch- und tiefgestellter Text auf einer Folie steht jetzt neben dem Text, zu dem er gehört, in der Größe und Höhe, die das Dokument vorgibt, im Fenster wie im exportierten PDF; seine Hervorhebung wandert mit. Hervorgehobener Text erscheint in einer Farbe, die sich auf der Hervorhebung lesen lässt."
