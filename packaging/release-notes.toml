# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.7.0"

[products.xodt.locales.en-us]
whats-new = "Export as PDF/UA: File > Export as PDF/UA… writes the document as a PDF that conforms to PDF/UA-1, the standard for accessible PDF, with its headings, lists, tables, links and pictures tagged in reading order and its fonts embedded. The window keeps its one continuous page; the PDF is laid out on the paper and margins of the document's own page style. A picture with no description is asked about first, and the answer is saved into the document."

[products.xodt.locales.de-de]
whats-new = "Export als PDF/UA: Datei > Als PDF/UA exportieren… schreibt das Dokument als PDF nach PDF/UA-1, der Norm für barrierefreies PDF, mit Überschriften, Listen, Tabellen, Links und Bildern in Lesereihenfolge ausgezeichnet und eingebetteten Schriften. Das Fenster behält seine eine durchgehende Seite; das PDF wird auf Papier und Ränder der eigenen Seitenvorlage gesetzt. Nach einem Bild ohne Beschreibung wird zuerst gefragt, und die Antwort wird im Dokument gespeichert."

[products.xods.locales.en-us]
whats-new = "Built with this release's shared library. Nothing in Odox Grid changes."

