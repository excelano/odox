# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.9.0"

[products.xodt.locales.en-us]
whats-new = "File > New starts a blank document, on Letter or A4 paper as your country prints, with the caret ready to type. In dark mode, text on a paragraph or table cell with a light fill is now readable, and black text a document sets on purpose follows the light or dark setting as text with no colour does."

[products.xodt.locales.de-de]
whats-new = "Datei > Neu beginnt ein leeres Dokument auf Letter- oder A4-Papier, wie Ihr Land druckt, mit der Einfügemarke bereit zum Tippen. Im dunklen Modus ist Text auf einem Absatz oder einer Tabellenzelle mit heller Füllung jetzt lesbar, und schwarzer Text, den ein Dokument ausdrücklich setzt, folgt der hellen oder dunklen Einstellung wie Text ohne Farbe."

[products.xods.locales.en-us]
whats-new = "The basics a spreadsheet needs: add, rename, delete and move sheets, with formulas following a renamed sheet; freeze the top rows and the left columns from the View menu; drag a header's edge to resize a column or row, or double-click a column's to fit it; Ctrl and the arrows, Page Up and Page Down, Ctrl+Home, Ctrl+End and Ctrl+A move as in other spreadsheets; and the bar above the grid gives the sum, average and count of a selection. A cell set to wrap its text now wraps it, on screen and in the PDF. File > New starts a blank workbook. In dark mode, text on a filled cell, and the black text spreadsheets write into every cell, are now readable."

[products.xods.locales.de-de]
whats-new = "Das Nötigste für Tabellen: Blätter hinzufügen, umbenennen, löschen und verschieben, wobei Formeln einem umbenannten Blatt folgen; oberste Zeilen und linke Spalten im Menü Ansicht fixieren; Spalten und Zeilen am Rand ihres Kopfs in der Größe ändern oder eine Spalte per Doppelklick einpassen; Strg mit den Pfeiltasten, Bild auf und Bild ab, Strg+Pos1, Strg+Ende und Strg+A bewegen sich wie in anderen Tabellenkalkulationen; und die Leiste über dem Gitter nennt Summe, Mittelwert und Anzahl einer Auswahl. Eine Zelle mit Zeilenumbruch bricht ihren Text jetzt um, am Bildschirm und im PDF. Datei > Neu beginnt ein leeres Tabellendokument. Im dunklen Modus sind Text auf gefüllten Zellen und der schwarze Text, den Tabellenkalkulationen in jede Zelle schreiben, jetzt lesbar."

[products.xodp.locales.en-us]
whats-new = "File > New starts a blank deck: one wide slide whose empty title says where to type, as any empty title or text placeholder now does while you edit. In dark mode, text on a light slide background or a filled shape is now readable."

[products.xodp.locales.de-de]
whats-new = "Datei > Neu beginnt einen leeren Foliensatz: eine breite Folie, deren leerer Titel zeigt, wo getippt wird, wie es jetzt jeder leere Titel- oder Textplatzhalter beim Bearbeiten tut. Im dunklen Modus ist Text auf einem hellen Folienhintergrund oder einer gefüllten Form jetzt lesbar."
