# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.10.0"

[products.xodt.locales.en-us]
whats-new = "Copying keeps its formatting outside the window: bold, italic, underline, strikethrough, headings and lists paste into another window and into word processors and browsers, and text copied from them keeps the same when it is pasted in."

[products.xodt.locales.de-de]
whats-new = "Kopieren behält die Formatierung auch außerhalb des Fensters: Fett, Kursiv, Unterstrichen, Durchgestrichen, Überschriften und Listen lassen sich in ein anderes Fenster und in Textverarbeitungen und Browser einfügen, und aus ihnen kopierter Text behält beim Einfügen dasselbe."

[products.xods.locales.en-us]
whats-new = "Merge a selection into one cell, and unmerge it, from the Sheet menu; a merged cell is picked, outlined and stepped over as one. A copied range reaches a word processor as a table. Copy, the selection's sum, average and count, Cut and Delete now leave hidden rows and columns alone. A screen reader can walk the cells in view as a grid, and says the picked cell as it moves."

[products.xods.locales.de-de]
whats-new = "Eine Auswahl im Menü Blatt zu einer Zelle verbinden und den Verbund wieder aufheben; eine verbundene Zelle wird als eine gewählt, umrandet und übersprungen. Ein kopierter Bereich kommt in einer Textverarbeitung als Tabelle an. Kopieren, Summe, Mittelwert und Anzahl einer Auswahl, Ausschneiden und Löschen lassen ausgeblendete Zeilen und Spalten jetzt unberührt. Ein Bildschirmleser kann die sichtbaren Zellen als Gitter durchgehen und nennt die gewählte Zelle, wenn sie wechselt."

[products.xodp.locales.en-us]
whats-new = "Slide > New slide adds a slide after the one in view, with a title and a text frame where its master puts them, the title looking like the one before it, and a click anywhere on an empty placeholder puts the caret in it. Titles and text typed in LibreOffice now take the size their slide's styles give them, on screen and in the PDF. Copying keeps its formatting in other windows and programs, and text copied from them keeps it when it is pasted in."

[products.xodp.locales.de-de]
whats-new = "Folie > Neue Folie fügt nach der angezeigten Folie eine Folie ein, mit Titel und Textrahmen dort, wo ihr Master sie vorsieht, der Titel wie der davor, und ein Klick irgendwo auf einen leeren Platzhalter setzt die Einfügemarke hinein. In LibreOffice getippte Titel und Texte erhalten jetzt die Größe, die die Formate ihrer Folie vorgeben, am Bildschirm und im PDF. Kopieren behält die Formatierung in anderen Fenstern und Programmen, und aus ihnen kopierter Text behält sie beim Einfügen."
