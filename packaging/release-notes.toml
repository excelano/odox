# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.18.1"

[products.xodt.locales.en-us]
whats-new = "A superscript or subscript now stands off the line again where the line also holds Hebrew or Arabic, and where it is the same size as the text around it. Exporting a right-to-left document with an empty paragraph to PDF no longer fails, and a right-to-left paragraph that ends with a line break keeps the empty line after it."

[products.xodt.locales.de-de]
whats-new = "Hoch- und tiefgestellter Text steht wieder erhöht oder tiefer, auch in einer Zeile mit hebräischem oder arabischem Text und wenn er so groß ist wie der Text daneben. Der PDF-Export eines Dokuments von rechts nach links mit einem leeren Absatz schlägt nicht mehr fehl, und ein Absatz von rechts nach links, der mit einem Zeilenumbruch endet, behält die leere Zeile danach."

[products.xods.locales.en-us]
whats-new = "Superscript and subscript text in a cell now stands off the line again where the cell also holds Hebrew or Arabic, and where it is the same size as the text around it."

[products.xods.locales.de-de]
whats-new = "Hoch- und tiefgestellter Text in einer Zelle steht wieder erhöht oder tiefer, auch wenn die Zelle hebräischen oder arabischen Text enthält und wenn er so groß ist wie der Text daneben."

[products.xodp.locales.en-us]
whats-new = "A superscript or subscript on a slide now stands off the line again where the line also holds Hebrew or Arabic, and where it is the same size as the text around it."

[products.xodp.locales.de-de]
whats-new = "Hoch- und tiefgestellter Text auf einer Folie steht wieder erhöht oder tiefer, auch in einer Zeile mit hebräischem oder arabischem Text und wenn er so groß ist wie der Text daneben."
