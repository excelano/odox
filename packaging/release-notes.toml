# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.12.0"

[products.xodt.locales.en-us]
whats-new = "Page up and Page down buttons sit under the page, and the keys now scroll while reading. Insert a table from the toolbar or Format > Table, add and remove its rows and columns, and move between cells with Tab. Exporting a PDF no longer stops the window while it works."

[products.xodt.locales.de-de]
whats-new = "Unter der Seite gibt es die Schaltflächen „Seite nach oben“ und „Seite nach unten“, und die Tasten Bild auf und Bild ab blättern jetzt auch beim Lesen. Fügen Sie über die Symbolleiste oder Format > Tabelle eine Tabelle ein, fügen Sie Zeilen und Spalten hinzu oder entfernen Sie sie, und wechseln Sie mit der Tabulatortaste zwischen den Zellen. Der PDF-Export hält das Fenster nicht mehr an, während er läuft."

[products.xods.locales.en-us]
whats-new = "Values you type take the cell's number format: currencies, percentages, dates and times appear as the cell says. Ctrl+Tab and Ctrl+Page Down move between sheets. Typing quickly into a cell no longer drops keys, and exporting a PDF no longer stops the window."

[products.xods.locales.de-de]
whats-new = "Eingegebene Werte übernehmen das Zahlenformat der Zelle: Währungen, Prozente, Datum und Uhrzeit erscheinen so, wie die Zelle es vorgibt. Strg+Tab und Strg+Bild ab wechseln zwischen den Blättern. Schnelles Tippen in eine Zelle verliert keine Tasten mehr, und der PDF-Export hält das Fenster nicht mehr an."

[products.xodp.locales.en-us]
whats-new = "Exporting a PDF no longer stops the window while it works, and File > New opens its own window on every system."

[products.xodp.locales.de-de]
whats-new = "Der PDF-Export hält das Fenster nicht mehr an, während er läuft, und Datei > Neu öffnet auf jedem System ein eigenes Fenster."
