# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops. So is a language
# written longer than the store takes, which a store answers by refusing the
# whole submission without saying which field was wrong.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

version = "0.19.2"

[products.xodt.locales.en-us]
whats-new = "A fix release. Text typed right after a field, such as a page count, goes after it, the arrows step over a field as one character, and a field moves with cut and paste. A date that follows the day is saved as today in headers and footers too, and editing a comment that holds a list keeps the list in its place. Unsaved changes kept against a crash return to the right file whatever its name holds, and a window that cannot keep them now says so."

[products.xodt.locales.de-de]
whats-new = "Eine Korrekturversion. Direkt nach einem Feld wie der Seitenanzahl getippter Text steht hinter dem Feld, die Pfeiltasten überspringen ein Feld als ein Zeichen, und ein Feld wandert mit Ausschneiden und Einfügen. Ein mitlaufendes Datum wird auch in Kopf- und Fußzeilen als heutiges gespeichert, und beim Bearbeiten eines Kommentars mit einer Liste bleibt die Liste an ihrem Platz. Gegen einen Absturz aufbewahrte ungespeicherte Änderungen kehren zur richtigen Datei zurück, was ihr Name auch enthält, und ein Fenster, das sie nicht aufbewahren kann, sagt das jetzt."

[products.xods.locales.en-us]
whats-new = "A fix release. Resizing a row or a column always leaves a step to undo. Unsaved changes kept against a crash return to the right file whatever its name holds, and a window that cannot keep them now says so."

[products.xods.locales.de-de]
whats-new = "Eine Korrekturversion. Das Ändern der Größe einer Zeile oder Spalte lässt sich immer rückgängig machen. Gegen einen Absturz aufbewahrte ungespeicherte Änderungen kehren zur richtigen Datei zurück, was ihr Name auch enthält, und ein Fenster, das sie nicht aufbewahren kann, sagt das jetzt."

[products.xodp.locales.en-us]
whats-new = "A fix release. Text typed right after a field in a label goes after it. Unsaved changes kept against a crash return to the right file whatever its name holds, and a window that cannot keep them now says so."

[products.xodp.locales.de-de]
whats-new = "Eine Korrekturversion. Direkt nach einem Feld in einer Beschriftung getippter Text steht hinter dem Feld. Gegen einen Absturz aufbewahrte ungespeicherte Änderungen kehren zur richtigen Datei zurück, was ihr Name auch enthält, und ein Fenster, das sie nicht aufbewahren kann, sagt das jetzt."
