<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The application icon: the glyph of the document icon, with the page
       dropped and the drawing grown to the grid it left. Three columns and
       three rows, the first row filled as a header. Centred on 32,32 so that a
       launcher which pads the icon pads it evenly, and drawn without a ground,
       so the desktop's own colour shows through. -->
  <!-- The header is a path rather than a rect because the corners it shares
       with the outer frame are rounded and a square fill would show past the
       stroke at large sizes. -->
  <path d="M10 14a3 3 0 0 1 3-3h38a3 3 0 0 1 3 3v11H10z" fill="#2e8b57"/>
  <g fill="none" stroke="#2e8b57" stroke-width="4">
    <rect x="10" y="11" width="44" height="42" rx="3"/>
    <path d="M10 25h44M10 39h44M25 11v42M39 11v42"/>
  </g>
</svg>
