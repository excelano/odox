<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The application icon: the glyph of the document icon, with the page
       dropped and the drawing grown to the grid it left. A slide on its stand,
       playing. Centred on 32,32 so that a launcher which pads the icon pads it
       evenly, and drawn without a ground, so the desktop's own colour shows
       through. -->
  <rect x="7" y="11" width="50" height="34" rx="3"
        fill="none" stroke="#c1683a" stroke-width="4"/>
  <path d="M27 20l16 8-16 8z" fill="#c1683a"/>
  <rect x="24" y="51" width="16" height="4" rx="2" fill="#c1683a"/>
</svg>
