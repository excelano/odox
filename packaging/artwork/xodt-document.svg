<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The document icon: the page, and the glyph of what is on it. Drawn on
       the 64-unit grid `make-icons` rasterizes every platform's icons from,
       with width and height on the root element so that a viewer which reads
       no `viewBox` still has a size. The application icon is the glyph alone;
       see the sibling file. -->
