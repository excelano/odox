[products.xods.locales."de-de"]
description = """
Odox Grid öffnet ein OpenDocument-Tabellendokument, lässt Sie die Zellen ändern, die es brauchen, und speichert es als das Dokument zurück, das es war.

Es ist ein leichter Editor, keine vollständige Tabellenkalkulation. Tippen auf der gewählten Zelle ersetzt sie, Enter oder F2 öffnet sie mit ihrem Inhalt, Entf leert sie, und Rückgängig nimmt alles zurück. Was Sie tippen, wird im Zahlenformat der Zelle gelesen, und was mit = beginnt, ist eine Formel, die sofort ausgerechnet wird; eine Änderung rechnet jede Formel neu, die die Zelle liest, und eine Formel mit einer Funktion, die Odox Grid nicht kennt, behält ihr letztes Ergebnis, blass gezeichnet. Strg+1 setzt Zahlenformat, Schrift, Füllung, Ausrichtung, Umbruch und Rahmen einer Zelle, Strg+D füllt eine Auswahl nach unten, das Quadrat an ihrer Ecke setzt eine Reihe fort, und das Menü Blatt sortiert einen Block und schreibt den Kommentar einer Zelle. Bedingte Formatierungen färben Zellen, solange ihre Bedingung gilt, die Gültigkeitsregel einer Zelle wird bei der Eingabe geprüft, und Bilder und Formen eines Blatts werden über seine Zellen gezeichnet. Strg+F sucht Text in jedem Blatt und Strg+H ersetzt ihn in den Zellen mit Text. Das Menü Blatt fügt Zeilen und Spalten ein, löscht sie, blendet sie aus und wieder ein, verbindet und trennt Zellen, fügt Blätter hinzu, benennt sie um, löscht und verschiebt sie, und die Formeln, die darauf verweisen, folgen. Ein falsch geschriebenes Wort in der Zelle, in die Sie tippen, wird unterstrichen, mit Vorschlägen per Rechtsklick. In Ihr Dokument wird nichts geschrieben, bis Sie speichern, und dann nur in die Datei, die Sie geöffnet haben, oder die, die Sie benannt haben. Solange Änderungen nicht gespeichert sind, wird eine Kopie davon auf Ihrem eigenen Rechner gegen einen Absturz bereitgehalten und entfernt, sobald Sie speichern oder verwerfen. Die eine Einstellung, die die Anwendung sich merkt, landet nur dann in einer Einstellungsdatei, wenn Sie sie ändern.

Das Blatt wird mit den Spaltenbreiten und Zeilenhöhen des Dokuments und den Zellformaten gezeichnet, die es mitbringt, Text umbrochen, wo eine Zelle es verlangt, und Zahlen, Datumsangaben und Wahrheitswerte erscheinen so, wie das Dokument es vorgibt.

Ein Blatt mit zehntausend leeren Zeilen zwischen zwei Zahlenblöcken öffnet so schnell wie ein dichtes, weil die Lücke so bleibt, wie das Dokument sie schreibt.

Datei > Neu beginnt ein leeres Tabellendokument, und Datei > Als PDF/UA exportieren… schreibt eines als barrierefreies PDF nach PDF/UA-1: jedes sichtbare Blatt eine ausgezeichnete Tabelle mit Kopfzeile, gedruckt nach seiner Seitenvorlage. Datei > Drucken… druckt dieselben Seiten.

Es besteht keinerlei Netzwerkverbindung. Kein Server dahinter, kein Konto, keine Analyse, keine Telemetrie, keine Absturzberichte, kein Dienst Dritter. Die Datenschutzangabe im Store lautet daher „Keine Daten erfasst", weil der Entwickler nichts erfasst und nichts hätte, wohin er es legen könnte. Die vollständige Erklärung steht unter https://excelano.com/legal/#odox, und weil der Quelltext offen ist, lässt sich jede Zeile davon nachprüfen.

Odox Grid ist eines von dreien, neben Odox Text für Textdokumente und Odox Deck für Präsentationen, alle von einem Zeichner dargestellt.

Was ein Editor tun muss und die meisten nicht tun: das ganze Dokument behalten. Jedes Element, jedes Attribut und jeder Leerraum Ihrer Datei übersteht das Einlesen, auch das, wovon Odox noch nie gehört hat, und was Sie nicht angefasst haben, wird so zurückgeschrieben, wie es gelesen wurde, Element für Element. Vor dem Speichern wird das, was geschrieben werden soll, zurückgelesen und mit dem Dokument im Fenster verglichen, und ein Unterschied verweigert das Speichern, statt ein Dokument zu schreiben, das nicht so zurückkäme.

In Rust geschrieben, frei und quelloffen unter der MIT-Lizenz, unter https://github.com/excelano/odox.
"""
website = "https://excelano.com/odox/"
support = "https://excelano.com/support/?app=Odox%20Grid&channel=Mac%20App%20Store"
privacy = "https://excelano.com/legal/#odox"

