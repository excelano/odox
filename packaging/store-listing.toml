[products.xodp]
apple-review-notes = """
Odox is three lightweight editors for OpenDocument files: Odox Text for text documents, Odox Grid for spreadsheets, Odox Deck for presentations. No account, no sign-in, no test credentials, and no network connection of any kind are needed to test any of them.

Open a document first. With nothing open the window is empty and there is nothing to try. This one reads from the repository and needs no release asset:

    Odox Deck
    https://github.com/excelano/odox/raw/main/corpus/libreoffice/growing-liberty.odp

It was written by LibreOffice rather than by hand, so what you are opening is what an office application actually emits. Nothing in it is anybody else's copyright. Any OpenDocument file of your own will do as well.

Edit mode, from the Edit menu or Ctrl+E, lets a reviewer pick a shape and drag it where it should be, resize it by a corner, click its text and change and format it where it sits, and take any of it back with Undo. The Slide menu adds, duplicates, moves and deletes slides and puts a text box, a picture or a comment on one. F5 starts a slideshow that reveals a slide's builds click by click, Ctrl+F finds text in the slides and in the notes and Ctrl+H replaces it, and a misspelled word is underlined with suggestions on a right click. Save writes the document back over the file that was opened and Save As writes it elsewhere, and File > Export as PDF/UA writes a PDF to a file named in the save panel, asking first about the two pictures in this deck that have no description. Inside the sandbox container the application also keeps one preference when it is changed, the words added to the spelling dictionary, and, while there are unsaved changes, a copy of them against a crash, removed once they are saved or discarded. Print writes a PDF to the container's temporary folder and hands it to Preview, where it is printed. Drawing shapes other than text boxes and changing a master page are outside the scope of the application rather than limitations of the review build. CFBundleTypeRole is Editor.

Odox Deck declares its one OpenDocument type at rank Alternate rather than Default or Owner. OpenDocument is an OASIS standard this project reads and does not own, on a machine that may well have a full office suite already claiming it, so the application adds itself to the list a person can choose from and does not ask to be preferred.

The App Sandbox is on with two entitlements: the sandbox itself, and read-write access to user-selected files, which is the grant a person gives by choosing a document in the open panel or naming one in the save panel. There is no network entitlement and no temporary exception. The application makes no network request.

The full privacy statement is at https://excelano.com/legal/#odox and the complete source is at https://github.com/excelano/odox.
"""
microsoft-review-notes = """
Odox is three lightweight editors for OpenDocument files: Odox Text for text documents, Odox Grid for spreadsheets, Odox Deck for presentations. No account, no sign-in, no test credentials, and no network connection of any kind are needed to test any of them.

Open a document first. With nothing open the window is empty and there is nothing to try. This one reads from the repository and needs no release asset:

    Odox Deck
    https://github.com/excelano/odox/raw/main/corpus/libreoffice/growing-liberty.odp

Nothing in it is anybody else's copyright. Any OpenDocument file of your own will do as well; right-click it and choose Odox Deck under Open With, or launch the application and use Open.

Edit mode, from the Edit menu or Ctrl+E, lets a reviewer pick a shape and drag it where it should be, resize it by a corner, click its text and change and format it where it sits, and take any of it back with Undo. The Slide menu adds, duplicates, moves and deletes slides and puts a text box, a picture or a comment on one. F5 starts a slideshow that reveals a slide's builds click by click, Ctrl+F finds text in the slides and in the notes and Ctrl+H replaces it, and a misspelled word is underlined with suggestions on a right click. Save writes the document back over the file that was opened and Save As writes it elsewhere; Export as PDF/UA asks about two undescribed pictures, then writes a PDF. Under %LOCALAPPDATA% it also keeps one preference, the words added to the dictionary, and a copy of unsaved changes against a crash; Print opens a temporary PDF in the default viewer.

The package declares runFullTrust and no other capability. It makes no network call, needs no broad filesystem access - it opens the file it was launched with and writes back to that file or to one a save dialog names - and asks for no device. The .odp association adds the application to Open With rather than claiming the default handler, since this is one editor for a format many applications open.
"""

[products.xodp.locales."en-us"]
description = """
Odox Deck opens an OpenDocument presentation, lets you change what is on its slides, and saves it back as the deck it was.

It is a lightweight editor, not a full presentation application. A deck opens reading; Edit mode, from the Edit menu or Ctrl+E, lets you pick a shape and drag it where it should be, resize it by a corner, click its text and change it where it sits, set its font, size, colour and alignment, take any of it back with Undo, and save. The Slide menu adds, duplicates, moves and deletes slides and puts a text box, a picture or a comment on one. F5 starts a slideshow that reveals a slide's builds click by click, Ctrl+F finds text in the slides and in the notes and Ctrl+H replaces it, and a misspelled word is underlined, with suggestions on a right click. You cannot draw other shapes or change a master page: for that you have an office suite. Nothing is written to your document until you press Save, and then only the file you opened or the one you named. While you have unsaved changes, a copy of them is kept on your own machine against a crash, and taken away when you save or discard them. The one preference the application keeps goes into a settings file only when you change it, and where the system allows it the application remembers the last ten documents you opened, for File > Open recent.

It draws each slide at the size the document sets. Behind the slide's own text and pictures is the master page: the ground it fills and the decorations a template puts on every slide, which is most of what makes a deck look like the template it was built from. The shapes are drawn from the geometry the document states rather than approximated into rectangles, which covers paths, custom shapes with their own formulas, connectors routed between the shapes they join, and the labels a shape carries. The speaker's notes sit underneath the slide and a list of slides beside it.

How well it draws is measured rather than asserted. Every slide of the templates in its corpus is rendered by Odox Deck and by LibreOffice from the same file, and the two are compared colour by colour, because a renderer is the kind of thing that passes every test and still looks wrong.

File > New starts a blank deck, one wide slide with a title to type into. File > Export as PDF/UA… writes the deck as an accessible PDF that conforms to PDF/UA-1: a page per slide, titles, text and pictures tagged in reading order; a picture with no description is asked about first. File > Print… prints the same pages.

It makes no network connection of any kind. There is no server behind it, no account to create, no analytics, no telemetry, no crash reporting and no third-party service. Its store privacy declaration is Data Not Collected, because the developer collects nothing and has nowhere to put it. The full statement is at https://excelano.com/legal/#odox and, because the source is open, every line of it is verifiable.

It is one of three, beside Odox Text for text documents and Odox Grid for spreadsheets, all drawn by one renderer.

What an editor has to do and most do not is keep the whole document. Every element, attribute and piece of whitespace in your file survives being read, including the ones Odox has never heard of, and what you did not touch is written back as it was read, element for element: a moved shape is four attributes changed, in the unit the document wrote them in, and nothing else. Before a save, what is about to be written is read back and compared with the document in the window, and a difference refuses the save rather than writing a document that would not come back the same.

Written in Rust, free, and open source under the MIT license, at https://github.com/excelano/odox.
"""
website = "https://excelano.com/odox/"
support = "https://excelano.com/support/?app=Odox%20Deck&channel=Mac%20App%20Store"
privacy = "https://excelano.com/legal/#odox"

