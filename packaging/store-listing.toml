[products.xodt.locales."en-us"]
description = """
Odox Text opens an OpenDocument text document, lets you change what is in it, and saves it back as the document it was.

It is a lightweight editor, not a full word processor. A document opens reading; Edit mode, from the Edit menu or Ctrl+E, lets you type into the page as it is drawn, set the font, size, colour and highlight, make text bold, italic, underlined, struck through, raised or lowered, align, indent and space paragraphs, and make them headings or list items. You can insert tables, pictures with a description of what they show, footnotes and endnotes, comments, links, page breaks, page numbers and dates, give the page a header and a footer, set its paper and margins, and accept or reject tracked changes. Every change is one step to undo. Ctrl+F finds text, matching case or whole words, and Ctrl+H replaces it; a misspelled word is underlined, with suggestions on a right click; the bar under the page counts words and characters. Copied text keeps its formatting, between windows and between programs. Nothing is written to your document until you press Save, and then only the file you opened or the one you named. While you have unsaved changes, a copy of them is kept on your own machine against a crash, and taken away when you save or discard them. The one preference the application keeps goes into a settings file only when you change it, and where the system allows it the application remembers the last ten documents you opened, for File > Open recent.

It draws the page at the width the document asks for. Headings, nested lists, tables with merged cells and borders, and the pictures inside the document appear where the document puts them, in the fonts it asks for, resolved against the ones you have installed. An outline sits beside the page and moves it when you click a heading.

File > New starts a blank document, on the paper your country prints on, ready to type into. File > Export as PDF/UA… writes the document as a PDF that conforms to PDF/UA-1, the ISO standard for accessible PDF: its headings, lists, tables, links and pictures are tagged so that assistive technology reads them in order, and its fonts travel inside the file. The window shows one continuous page; the PDF is laid out on the paper and margins the document's own page style gives. Every export is checked against the standard as it is written, and a picture with no description is asked about first, so nothing reaches the file under that name without one. File > Print… prints the same pages.

It makes no network connection of any kind. There is no server behind it, no account to create, no analytics, no telemetry, no crash reporting and no third-party service. Its store privacy declaration is Data Not Collected, because the developer collects nothing and has nowhere to put it. The full statement is at https://excelano.com/legal/#odox and, because the source is open, every line of it is verifiable.

It is one of three, beside Odox Grid for spreadsheets and Odox Deck for presentations, all drawn by one renderer.

What an editor has to do and most do not is keep the whole document. Every element, attribute and piece of whitespace in your file survives being read, including the ones Odox has never heard of, and what you did not touch is written back as it was read, element for element. Before a save, what is about to be written is read back and compared with the document in the window, and a difference refuses the save rather than writing a document that would not come back the same.

Written in Rust, free, and open source under the MIT license, at https://github.com/excelano/odox.
"""
