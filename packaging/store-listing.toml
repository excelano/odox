[products.xodt.locales."de-de"]
description = """
Odox Text öffnet ein OpenDocument-Textdokument, lässt Sie ändern, was darin steht, und speichert es als das Dokument zurück, das es war.

Es ist ein leichter Editor, keine vollständige Textverarbeitung. Ein Dokument öffnet sich zum Lesen; der Bearbeitungsmodus, im Menü Bearbeiten oder mit Strg+E, lässt Sie direkt in die gezeichnete Seite tippen, Schriftart, Größe, Farbe und Hervorhebung setzen, Text fett, kursiv, unterstrichen, durchgestrichen, hoch- oder tiefgestellt formatieren, Absätze ausrichten, einrücken und ihren Abstand setzen und sie zu Überschriften oder Listeneinträgen machen. Sie können Tabellen einfügen, Bilder mit einer Beschreibung dessen, was sie zeigen, Fuß- und Endnoten, Kommentare, Links, Seitenumbrüche, Seitenzahlen und Datumsangaben, der Seite eine Kopf- und eine Fußzeile geben, Papier und Ränder einstellen und nachverfolgte Änderungen annehmen oder ablehnen. Jede Änderung ist ein Schritt zum Rückgängigmachen. Strg+F sucht Text und Strg+H ersetzt ihn; ein falsch geschriebenes Wort wird unterstrichen, mit Vorschlägen per Rechtsklick; die Leiste unter der Seite zählt Wörter und Zeichen. In Ihr Dokument wird nichts geschrieben, bis Sie speichern, und dann nur in die Datei, die Sie geöffnet haben, oder die, die Sie benannt haben. Solange Änderungen nicht gespeichert sind, wird eine Kopie davon auf Ihrem eigenen Rechner gegen einen Absturz bereitgehalten und entfernt, sobald Sie speichern oder verwerfen. Die eine Einstellung, die die Anwendung sich merkt, landet nur dann in einer Einstellungsdatei, wenn Sie sie ändern, und wo das System es zulässt, merkt sich die Anwendung die zehn zuletzt geöffneten Dokumente für Datei > Zuletzt verwendete Dokumente.

Die Seite wird in der Breite gezeichnet, die das Dokument verlangt. Überschriften, verschachtelte Listen, Tabellen mit verbundenen Zellen und Rahmen sowie die Bilder im Dokument erscheinen dort, wo das Dokument sie hinsetzt, in den Schriften, die es verlangt, aufgelöst gegen die auf Ihrem Rechner installierten. Neben der Seite steht eine Gliederung, die beim Klick auf eine Überschrift dorthin springt.

Datei > Neu beginnt ein leeres Dokument auf dem Papier, auf dem Ihr Land druckt, bereit zum Tippen. Datei > Als PDF/UA exportieren… schreibt das Dokument als PDF nach PDF/UA-1, der ISO-Norm für barrierefreies PDF: Überschriften, Listen, Tabellen, Links und Bilder sind so ausgezeichnet, dass Hilfstechnologien sie in Lesereihenfolge vorlesen, und die Schriften reisen in der Datei mit. Das Fenster zeigt eine durchgehende Seite; das PDF wird auf Papier und Ränder der eigenen Seitenvorlage gesetzt. Jeder Export wird beim Schreiben gegen die Norm geprüft, und nach einem Bild ohne Beschreibung wird zuerst gefragt. Datei > Drucken… druckt dieselben Seiten.

Es besteht keinerlei Netzwerkverbindung. Kein Server dahinter, kein Konto, keine Analyse, keine Telemetrie, keine Absturzberichte, kein Dienst Dritter. Die Datenschutzangabe im Store lautet daher „Keine Daten erfasst", weil der Entwickler nichts erfasst und nichts hätte, wohin er es legen könnte. Die vollständige Erklärung steht unter https://excelano.com/legal/#odox, und weil der Quelltext offen ist, lässt sich jede Zeile davon nachprüfen.

Odox Text ist eines von dreien, neben Odox Grid für Tabellendokumente und Odox Deck für Präsentationen, alle von einem Zeichner dargestellt.

Was ein Editor tun muss und die meisten nicht tun: das ganze Dokument behalten. Jedes Element, jedes Attribut und jeder Leerraum Ihrer Datei übersteht das Einlesen, auch das, wovon Odox noch nie gehört hat, und was Sie nicht angefasst haben, wird so zurückgeschrieben, wie es gelesen wurde, Element für Element. Vor dem Speichern wird das, was geschrieben werden soll, zurückgelesen und mit dem Dokument im Fenster verglichen, und ein Unterschied verweigert das Speichern, statt ein Dokument zu schreiben, das nicht so zurückkäme.

In Rust geschrieben, frei und quelloffen unter der MIT-Lizenz, unter https://github.com/excelano/odox.
"""
