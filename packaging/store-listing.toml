Open a document first. With nothing open the window is empty and there is nothing to try. This one reads from the repository and needs no release asset:

    Odox Text
    https://github.com/excelano/odox/raw/main/corpus/libreoffice/text.odt

Nothing in it is anybody else's copyright. Any OpenDocument file of your own will do as well; right-click it and choose Odox Text under Open With, or launch the application and use Open.

Edit mode, from the Edit menu or Ctrl+E, lets a reviewer click into the page and type, format text and paragraphs from the bar above the page or the Format menu, and insert a table, a picture, a footnote, a comment, a link or a field, each one step to undo. Ctrl+F finds text and Ctrl+H replaces it, and a misspelled word is underlined with suggestions on a right click. Save writes the document back over the file that was opened and Save As writes it elsewhere; Export as PDF/UA writes a PDF where its save dialog says. Under %LOCALAPPDATA% it also keeps one preference, the words added to the dictionary, and a copy of unsaved changes against a crash; Print opens a temporary PDF in the default viewer.

