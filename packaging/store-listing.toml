[products.xodt]
apple-review-notes = """
Odox is three lightweight editors for OpenDocument files: Odox Text for text documents, Odox Grid for spreadsheets, Odox Deck for presentations. No account, no sign-in, no test credentials, and no network connection of any kind are needed to test any of them.

Open a document first. With nothing open the window is empty and there is nothing to try. This one reads from the repository and needs no release asset:

    Odox Text
    https://github.com/excelano/odox/raw/main/corpus/libreoffice/text.odt

It was written by LibreOffice rather than by hand, so what you are opening is what an office application actually emits. Nothing in it is anybody else's copyright. Any OpenDocument file of your own will do as well.

Edit mode, from the Edit menu or Ctrl+E, lets a reviewer click into the page and type, format text and paragraphs from the bar above the page or the Format menu, and insert a table, a picture, a footnote, a comment, a link or a field, each one step to undo. Ctrl+F finds text and Ctrl+H replaces it, a misspelled word is underlined with suggestions on a right click, and a click on a link opens it. Save writes the document back over the file that was opened and Save As writes it elsewhere, and File > Export as PDF/UA writes a PDF to a file named in the save panel. Inside the sandbox container the application also keeps one preference when it is changed, the words added to the spelling dictionary, and, while there are unsaved changes, a copy of them against a crash, removed once they are saved or discarded. Print writes a PDF to the container's temporary folder and hands it to Preview, where it is printed. CFBundleTypeRole is Editor.

Odox Text declares its one OpenDocument type at rank Alternate rather than Default or Owner. OpenDocument is an OASIS standard this project reads and does not own, on a machine that may well have a full office suite already claiming it, so the application adds itself to the list a person can choose from and does not ask to be preferred.

The App Sandbox is on with two entitlements: the sandbox itself, and read-write access to user-selected files, which is the grant a person gives by choosing a document in the open panel or naming one in the save panel. There is no network entitlement and no temporary exception. The application makes no network request.

The full privacy statement is at https://excelano.com/legal/#odox and the complete source is at https://github.com/excelano/odox.
"""
microsoft-review-notes = """
