<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <clipPath id="rounded"><rect width="64" height="64" rx="14.317"/></clipPath>
  <g clip-path="url(#rounded)">
  <!-- The application icon: the glyph of the document icon, with the page
       dropped and the drawing grown to the grid it left. Lines of text, the
       last one short. Centred on 32,32 so that a launcher which pads the icon
       pads it evenly, and drawn without a ground, so the desktop's own colour
       shows through. -->
  <g fill="#2f6fb0">
    <rect x="10" y="15" width="44" height="6" rx="3"/>
    <rect x="10" y="29" width="44" height="6" rx="3"/>
    <rect x="10" y="43" width="28" height="6" rx="3"/>
  </g>
</g>
</svg>
