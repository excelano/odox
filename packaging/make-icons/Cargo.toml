# The tool that turns the icon SVGs into every raster the three platforms want.
#
# Its own package rather than a member of the workspace, so that nothing here
# reaches the shipped binaries: `cargo build --workspace` at the root never sees
# it and `cargo tree` for an application is unchanged by it. The empty
# `[workspace]` table below is what keeps it standalone.
#
# It sits at the top of `packaging/` rather than inside one platform's arm,
# because it writes into three of them and `packaging/README.md` reserves this
# level for what is shared.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

[workspace]

[package]
name = "make-icons"
description = "Rasterize the odox icon SVGs into the icons and store assets three platforms want"
version = "0.1.0"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
publish = false

[dependencies]
# Pure-Rust SVG rendering. Default features off: they bring text shaping and a
# system font database, and none of these drawings has a letter in it.
resvg = { version = "0.48", default-features = false }
# The Windows icon directory.
ico = "0.5"
# The macOS icon family. Pure Rust, and the reason none of this needs a Mac:
# the fleet's other repositories render their `.icns` with `sips` and
# `iconutil`, which exist only there. DESIGN.md §9 and ~/notes/mac_icons_on_linux.md.
icns = "0.4"
