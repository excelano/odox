# Build, test and open a document on Apple silicon. `cargo check` on Linux never
# links or runs the Apple-specific code, so this is where `odox-ui`'s
# `opened_document`, the only `unsafe` in the workspace, is exercised: `open`
# delivers the Apple Event Finder does, and the window server is asked whether a
# window appeared and what it is titled. A title that is the bare application
# name means the event launched the application without the document.
# Not reached: the sandbox, a high-density display, the Dock icon and Finder's
# rendering of the types.
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Apple silicon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apple-silicon-${{ github.ref }}
  cancel-in-progress: true

env:
  # The bundle declares 11.0 and `build-app.sh` refuses a binary built for another floor.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # A runner label is a promise rather than a fact, so the architecture is checked.
      - name: The runner is Apple silicon
        run: |
          arch=$(uname -m)
          echo "runner reports ${arch}"
          [ "$arch" = arm64 ] || {
            echo "this workflow exists to test arm64 and the runner is ${arch}" >&2
            exit 1
          }

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V && xcodebuild -version | head -1

      # DESIGN.md §2 forbids compiling C; `cargo tree -i cc` cannot answer that,
      # so this checks the outcome.
      - name: Build, and nothing compiled C
        run: |
          cargo build --workspace --all-targets
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          objects=$(find "${target}" -path '*/build/*' \( -name '*.o' -o -name '*.a' \) -print)
          [ -z "$objects" ] || { echo "a build script produced object files:"; echo "$objects"; exit 1; }

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      # The bundle is the unit: a bare executable has no bundle identifier and no
      # Apple Event reaches it. Debug binaries, because the question does not
      # depend on optimisation; `build-app.sh` also runs the private-symbol check.
      - name: Assemble the three bundles
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          for app in xodt xods xodp; do
            ./packaging/macos/build-app.sh "$app" --binary "${target}/debug/${app}"
          done
          for bundle in dist/*.app; do
            echo "== ${bundle}"
            plutil -lint "${bundle}/Contents/Info.plist"
            lipo -info "${bundle}/Contents/MacOS/"*
            ls "${bundle}/Contents/Resources"
          done

      # `open` delivers the Apple Event a double-click does, once per application.
      - name: A document opens, and a window appears
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          swiftc -O packaging/macos/window-probe.swift -o "${RUNNER_TEMP}/window-probe"

          set -- "xodt:Odox Text:corpus/libreoffice/text.odt" \
                 "xods:Odox Grid:corpus/libreoffice/calc.ods" \
                 "xodp:Odox Deck:corpus/libreoffice/growing-liberty.odp"

          # A window that never appeared has two very different causes and the
          # probe cannot tell them apart: the application died before it drew,
          # or it drew nothing because the Apple Event never reached it. This
          # separates them. Running the bundle's own executable with the
          # document as an ordinary argument takes Launch Services out of the
          # picture entirely, so a window here and none through `open` is the
          # Apple Event, while no window either way is the application.
          diagnose() {
            app=$1 ; product=$2 ; document=$3
            echo "--- diagnosing ${app}"

            # An `.ips` is two JSON documents: a one-line header and then the
            # body. Everything worth reading is in the body, and the first forty
            # lines of it are the machine's description of itself, so this asks
            # for the three things that say what happened instead of printing
            # from the top. The whole file is kept as an artefact either way.
            reports=$HOME/Library/Logs/DiagnosticReports
            mkdir -p "${RUNNER_TEMP}/crashes"
            found=$(ls -t "$reports" 2>/dev/null | grep -i "^${app}" | head -2 || true)
            if [ -n "$found" ]; then
              for report in $found; do
                echo "--- crash report ${report}"
                cp "${reports}/${report}" "${RUNNER_TEMP}/crashes/" || true
                tail -n +2 "${reports}/${report}" | jq -r '
                  "exception:   \(.exception // "none")",
                  "termination: \(.termination // "none")",
                  "asi:         \(.asi // "none")",
                  "faulting thread \(.faultingThread // 0):",
                  ( .usedImages as $images
                    | .threads[.faultingThread // 0].frames[]?
                    | "  \($images[.imageIndex].name // "?")  \(.symbol // .imageOffset)" )
                ' || echo "    (jq could not read it; the artefact has the whole file)"
              done
            else
              echo "--- no crash report, so it did not die the way a crash is recorded"
            fi

            # The panic message itself, which the crash report does not carry:
            # a bundled application's stderr goes to the unified log rather than
            # to the terminal that started it.
            echo "--- what it said on standard error"
            if [ -s "${RUNNER_TEMP}/${app}-open.err" ]; then
              cat "${RUNNER_TEMP}/${app}-open.err"
            else
              echo "    (nothing)"
            fi

            echo "--- what the unified log caught"
            log show --last 3m --predicate "process == \"${app}\"" --style compact 2>/dev/null \
              | grep -iE "panic|assert|borrow|already|unwind" | head -10 \
              || echo "    (nothing in the log)"

            # The control, and the question it settles: is the Apple Event
            # involved at all? Launch Services with no document to deliver runs
            # every line of the launch path except the event. A crash here too
            # means the handler is not implicated and the fault is in the launch;
            # a clean run here and a crash with a document means it is.
            echo "--- the same launch, with no document to deliver"
            open -a "$PWD/dist/${product}.app"
            sleep 6
            if "${RUNNER_TEMP}/window-probe" "$product" "$app" >/dev/null 2>&1; then
              echo "    a window appeared with no document, so the launch path is fine"
              echo "    and the Apple Event is what this crash is about"
            else
              echo "    no window even with no document, so this is the launch and"
              echo "    not the Apple Event"
            fi
            osascript -e "tell application \"${product}\" to quit" >/dev/null 2>&1 || true

            echo "--- launching the executable directly, with the document as argv"
            "dist/${product}.app/Contents/MacOS/${app}" "$PWD/${document}" \
              >"${RUNNER_TEMP}/${app}-direct.log" 2>&1 &
            direct=$!
            sleep 8
            if kill -0 "$direct" 2>/dev/null; then
              "${RUNNER_TEMP}/window-probe" "$product" "$app" || true
              kill "$direct" 2>/dev/null || true
              echo "--- it stayed up when launched directly"
            else
              wait "$direct" 2>/dev/null
              echo "--- it exited on its own; output follows"
            fi
            sed -n '1,40p' "${RUNNER_TEMP}/${app}-direct.log"
          }

          failed=0
          for entry in "$@"; do
            app=${entry%%:*}
            rest=${entry#*:}
            product=${rest%%:*}
            document=${rest#*:}
            echo "== ${product} (${app}) with ${document}"

            "$lsregister" -f "$PWD/dist/${product}.app"
            # `--stderr` because a bundled application's standard error goes
            # nowhere a shell can see it, and a Rust panic writes its message
            # there and nowhere else. The crash report records that an abort
            # happened and not what was said before it.
            open --stderr "${RUNNER_TEMP}/${app}-open.err" \
                 -a "$PWD/dist/${product}.app" "$PWD/${document}"

            # Cold launch, a window server, and a first frame. Polled rather
            # than slept at; 30 seconds is far past anything measured by hand.
            for _ in $(seq 1 15); do
              sleep 2
              "${RUNNER_TEMP}/window-probe" "$product" "$app" >/dev/null 2>&1 && break
            done

            set +e
            report=$("${RUNNER_TEMP}/window-probe" "$product" "$app")
            verdict=$?
            set -e
            echo "$report"

            case "$verdict" in
              0) echo "  ${app} drew a window for a document opened through Launch Services" ;;
              2)
                # Not a failure of the application, and deliberately not a pass
                # either: a check that can quietly not check is the thing this
                # fleet keeps getting caught by.
                echo "::error::The window server listed nothing, so this run answered nothing about ${app}."
                failed=1 ; diagnose "$app" "$product" "$document" ; continue ;;
              *)
                echo "::error::No window appeared for a document opened through Launch Services on arm64 (${app}). This is odox-ui's opened_document, the only unsafe in the workspace."
                failed=1 ; diagnose "$app" "$product" "$document" ; continue ;;
            esac

            # A title that is exactly the application name means the event
            # launched the application and did not hand over the document,
            # which is the refusal this whole step exists to catch. Any other
            # title names a document, because the window titles itself from the
            # document's own title or its filename.
            case "$report" in
              *"titled \"${app}\""*)
                echo "::error::${app} opened a window titled with nothing but its own name, so the Apple Event launched it without delivering the document."
                failed=1 ;;
              *'titled "'*)
                echo "  and the window names a document, so the Apple Event delivered it" ;;
              *)
                echo "::warning::The window server withheld ${app}'s title, so whether the document was delivered rather than merely the application launched is not answered here." ;;
            esac

            osascript -e "tell application \"${product}\" to quit" >/dev/null 2>&1 || true
          done
          exit "$failed"

      # For eyes, not for the verdict. The step above is what passes or fails.
      - name: Photograph it, for a person
        if: always()
        run: |
          screencapture -x "${RUNNER_TEMP}/screen.png" || true
          ls -l "${RUNNER_TEMP}/screen.png" || true

      - name: Keep the photograph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-window
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: ignore

      # Whole files, because a crash report is cheap to keep.
      - name: Keep any crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-crashes
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore
