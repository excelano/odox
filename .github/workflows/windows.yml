# Run the suite on Windows, check the things only a Windows machine can say,
# and assemble the Store package, attaching it to a published release. The
# checks themselves live in excelano/.github so every desktop-app repo in the
# fleet runs the same ones and a correction reaches all of them at once; what
# stays here is this product's own names, paths, its three applications and
# the icon-embedding check none of the others need.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what attaches the package.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # package is attached to that release; without one it is built and kept
      # as an artefact.
      tag:
        description: 'Tag to package for (e.g. v0.3.1)'
        required: false
        type: string
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']
      # Which of the three applications a screenshots run photographs. odox
      # ships three executables from one workspace, so - unlike a
      # single-application repo, where the recipes already know what to open -
      # a set has to say which one; ship's own dispatch sends this whenever it
      # asks for a set.
      app:
        description: 'Application to photograph (with screenshots): xodt, xods or xodp'
        required: false
        type: choice
        options: ['', 'xodt', 'xods', 'xodp']

permissions:
  contents: write

jobs:
  windows:
    uses: excelano/.github/.github/workflows/windows-desktop-ci.yml@main
    with:
      tag: ${{ inputs.tag }}
      binary-names: 'xodt xods xodp'
      workspace: true
      install-rust: true
      fmt: true
      gui-subsystem-check: true
      icon-check: true
      icon-check-manifest: packaging/make-icons/Cargo.toml
      icon-check-paths: 'packaging/windows packaging/macos packaging/icons'
      install-check-associations: '[{"extension": ".odt", "progId": "Excelano.Odox.Text", "contentType": "application/vnd.oasis.opendocument.text"}, {"extension": ".ods", "progId": "Excelano.Odox.Grid", "contentType": "application/vnd.oasis.opendocument.spreadsheet"}, {"extension": ".odp", "progId": "Excelano.Odox.Deck", "contentType": "application/vnd.oasis.opendocument.presentation"}]'
      install-check-owns-extension: 'false'
      store-package-args: '-All'
      screenshots: ${{ inputs.screenshots }}
      # `-Only app` narrows the set to one application - ship's own dispatch
      # always sends `app` for a repo with more than one, anderix/ship#103 -
      # and is left off where none was given, which is every three
      # applications' frames, same as before this existed. No
      # pre-screenshot-script: this repository's frames launch the release
      # executables by name with the document as an argument, because an
      # install here never writes `UserChoice` and on a machine with an office
      # suite the shell would open the office suite.
      shot-args: ${{ inputs.app && format('-Only {0}', inputs.app) || '' }}
      # Windows takes a window's icon from a resource and this build compiles
      # none, so `build.rs` stages the `.ico` into OUT_DIR; the icon
      # directory's own bytes in the binary say the staging worked. Unique to
      # odox's three viewers, so it stays here rather than in the shared file.
      extra-verify-script: |
        $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
        foreach ($app in 'xodt', 'xods', 'xodp') {
          $exe = Join-Path $meta.target_directory "release\$app.exe"
          $ico = [System.IO.File]::ReadAllBytes("packaging/windows/$app.ico")
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $needle = $ico[0..63]
          $found = $false
          for ($i = 0; $i -lt $bytes.Length - $needle.Length; $i++) {
            if ($bytes[$i] -ne $needle[0]) { continue }
            $match = $true
            for ($j = 1; $j -lt $needle.Length; $j++) {
              if ($bytes[$i + $j] -ne $needle[$j]) { $match = $false; break }
            }
            if ($match) { $found = $true; break }
          }
          if (-not $found) {
            throw "$app.ico is not inside $app.exe - build.rs staged nothing and the window will have no icon"
          }
          Write-Host "$app : the icon directory is in the binary"
        }
    secrets: inherit
