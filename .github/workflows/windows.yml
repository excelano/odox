# The Windows checks a machine can run: build, test, clippy and format on this
# target; each shipped binary imports nothing Windows does not ship; the viewers
# are GUI subsystem with the DPI manifest and the icon embedded; the integration
# installs and uninstalls cleanly; the committed icons match their generator.
#
# Not reached: the window, an MSIX package, a file association, the certification
# kit, `build-msix.ps1`, and the icon as a person sees it.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what attaches the package.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package for (e.g. v0.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      # `+crt-static` keeps the Visual C++ runtime out of the MSVC build, and this
      # is the guard on it, over the release binaries because those are what ship.
      - name: Every DLL the shipped binaries import comes with Windows
        run: |
          cargo build --release
          powershell -ExecutionPolicy Bypass -File packaging/windows/check-imports.ps1

      # The GUI subsystem comes from an attribute that is off under
      # `debug_assertions`, and the DPI declaration from the manifest `build.rs`
      # hands the linker; both are read out of the release artefact. The launcher
      # is a console program on purpose and embeds no manifest, so it is exempt.
      - name: The shipped viewers are GUI subsystem and declare their DPI awareness
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          foreach ($app in 'xodt', 'xods', 'xodp') {
            $exe = Join-Path $meta.target_directory "release\$app.exe"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 92)
            if ($subsystem -ne 2) {
              throw "$app is subsystem $subsystem, and a shipped viewer must be 2 (Windows GUI)"
            }
            # Case-insensitively, because Windows reads these values that way
            # and this manifest writes them in lower case with a fallback for
            # older releases, `permonitorv2,permonitor`, where the fleet's other
            # manifests write the single mixed-case `PerMonitorV2`. A check
            # copied from a sibling and left case-sensitive fails a binary whose
            # manifest is embedded and correct, which is what it did here.
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($text -notmatch 'permonitorv2') {
              throw "no per-monitor DPI declaration in $app - build.rs did not embed the application manifest"
            }
            Write-Host "$app : subsystem 2, and the application manifest is embedded"
          }

      # Windows takes a window's icon from a resource and this build compiles none,
      # so `build.rs` stages the `.ico` into OUT_DIR; the icon directory's own
      # bytes in the binary say the staging worked.
      - name: The window icon reached the binaries
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          foreach ($app in 'xodt', 'xods', 'xodp') {
            $exe = Join-Path $meta.target_directory "release\$app.exe"
            $ico = [System.IO.File]::ReadAllBytes("packaging/windows/$app.ico")
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $needle = $ico[0..63]
            $found = $false
            for ($i = 0; $i -lt $bytes.Length - $needle.Length; $i++) {
              if ($bytes[$i] -ne $needle[0]) { continue }
              $match = $true
              for ($j = 1; $j -lt $needle.Length; $j++) {
                if ($bytes[$i + $j] -ne $needle[$j]) { $match = $false; break }
              }
              if ($match) { $found = $true; break }
            }
            if (-not $found) {
              throw "$app.ico is not inside $app.exe - build.rs staged nothing and the window will have no icon"
            }
            Write-Host "$app : the icon directory is in the binary"
          }

      # Nothing else reaches the installer and its uninstaller. This registers real
      # entries under HKCU and takes them away, so it belongs on a build agent.
      - name: The integration installs, uninstalls, and leaves nothing behind
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/check-install.ps1

      # The `.ico` files, the package assets and the `.icns` files are committed
      # artefacts, so the generator is run and its output compared with the tree,
      # over whole directories rather than named files.
      - name: The committed icons and Store assets still match their generator
        run: |
          cargo run --manifest-path packaging/make-icons/Cargo.toml
          git diff --exit-code -- packaging/windows packaging/macos packaging/icons

      # The Store takes the package unsigned, and the runner assembles the one that
      # is uploaded. `identity.psd1` is committed beside the build script; the
      # publisher is the organisation secret, being the one value in the identity
      # that is an account's rather than this product's. Without it a release
      # refuses and a push packages under a throwaway, so the packaging is still
      # proved on every commit.
      - name: Package for the Store, unsigned
        shell: pwsh
        env:
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          if (-not $env:STORE_PUBLISHER) {
            if ('${{ github.event_name }}' -eq 'release') {
              throw 'a release package needs the real publisher: set the excelano organisation secret STORE_PUBLISHER to Partner Center''s Package/Identity/Publisher'
            }
            $env:STORE_PUBLISHER = 'CN=00000000-0000-0000-0000-000000000000'
          }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build-msix.ps1 -All -OutDir dist
          Get-ChildItem dist\*.msix | ForEach-Object { "$($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Keep the package
        uses: actions/upload-artifact@v6
        with:
          name: msix
          path: dist/*.msix

      - name: Attach the package to the release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" (Get-ChildItem dist\*.msix).FullName
