# The Windows checks a machine can run: that the tree builds and passes on this
# platform, that each shipped binary imports nothing Windows does not have, and
# that the committed icons still match the drawings they were generated from.
#
# The shape is segler's `windows.yml`, and `linux.yml` beside this is its
# counterpart. The suite, clippy and formatting are also the fleet's `ci.yml`;
# they are repeated here because `ci.yml` runs on Linux and three things in this
# repository are compiled only for this target: `build.rs`'s manifest arm, the
# `ico` dependency, and the window icon the `include_bytes!` in each application
# reaches. a `cargo check --target` on Linux compiles those; it does not
# link them, run them, or read an import table.
#
# **Four binaries, not one.** The three viewers and the launcher, which draws no
# window and links no toolkit and therefore imports fewer libraries than they do.
# `check-imports.ps1` takes them all and works from an allowlist rather than an
# exact list, so fewer is not reported as a change.
#
# What this reaches and what it does not, stated because a green tick invites
# more faith than it has earned.
#
# Nothing here reaches the window, the installer scripts, an MSIX package, a
# file association, the certification kit, or the icon as a person sees it at
# any size. `CHECKLIST.md` holds those and a green run here does not stand in for
# one. `build-msix.ps1` is not run either: it needs the Windows SDK and the
# package identity, and the identity is not committed.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      # The defect this exists for was invisible to everything else: slipcase
      # 0.1.1 passed every local check and failed Store certification because
      # the MSVC target linked a Visual C++ runtime DLL that every build machine
      # has and a clean machine does not. `+crt-static` is the cure and this is
      # the guard on it.
      #
      # The release binaries rather than the debug ones, because the release
      # binaries are what ship and are the only ones whose import tables are the
      # artefact's.
      - name: Every DLL the shipped binaries import comes with Windows
        run: |
          cargo build --release
          powershell -ExecutionPolicy Bypass -File packaging/windows/check-imports.ps1

      # The release binaries are also the only place two other properties exist.
      # The GUI subsystem comes from an attribute that is off under
      # `debug_assertions`, and a console-subsystem build puts a console window
      # behind the application when a file manager launches it. The DPI
      # declaration comes from `build.rs` handing the linker a manifest, and the
      # certification kit reads it out of the binary rather than out of the
      # running process. `build-msix.ps1` refuses on the first and the kit
      # reports the second, and neither runs here, so both are read straight out
      # of the artefact instead.
      #
      # The launcher is exempt from both. It is a console program on purpose,
      # because it is run from a shell and its `--which` answer is text, and it
      # embeds no manifest for the same reason.
      - name: The shipped viewers are GUI subsystem and declare their DPI awareness
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          foreach ($app in 'xodt', 'xods', 'xodp') {
            $exe = Join-Path $meta.target_directory "release\$app.exe"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 92)
            if ($subsystem -ne 2) {
              throw "$app is subsystem $subsystem, and a shipped viewer must be 2 (Windows GUI)"
            }
            # Case-insensitively, because Windows reads these values that way
            # and this manifest writes them in lower case with a fallback for
            # older releases, `permonitorv2,permonitor`, where the fleet's other
            # manifests write the single mixed-case `PerMonitorV2`. A check
            # copied from a sibling and left case-sensitive fails a binary whose
            # manifest is embedded and correct, which is what it did here.
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($text -notmatch 'permonitorv2') {
              throw "no per-monitor DPI declaration in $app - build.rs did not embed the application manifest"
            }
            Write-Host "$app : subsystem 2, and the application manifest is embedded"
          }

      # The window icon travels in the binary because Windows takes one from a
      # resource and this build compiles no resource. `build.rs` stages the
      # `.ico` into OUT_DIR and writes an empty file when the source is absent,
      # which is what a build from a published crate gets, so a staging mistake
      # here would show as a window with no icon and nothing else. The icon
      # directory's own bytes appear in the binary, so its signature is what says
      # the staging worked.
      - name: The window icon reached the binaries
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          foreach ($app in 'xodt', 'xods', 'xodp') {
            $exe = Join-Path $meta.target_directory "release\$app.exe"
            $ico = [System.IO.File]::ReadAllBytes("packaging/windows/$app.ico")
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $needle = $ico[0..63]
            $found = $false
            for ($i = 0; $i -lt $bytes.Length - $needle.Length; $i++) {
              if ($bytes[$i] -ne $needle[0]) { continue }
              $match = $true
              for ($j = 1; $j -lt $needle.Length; $j++) {
                if ($bytes[$i + $j] -ne $needle[$j]) { $match = $false; break }
              }
              if ($match) { $found = $true; break }
            }
            if (-not $found) {
              throw "$app.ico is not inside $app.exe - build.rs staged nothing and the window will have no icon"
            }
            Write-Host "$app : the icon directory is in the binary"
          }

      # The installer and its uninstaller, which nothing else reaches. A green
      # tick on the steps above says the binaries are sound and says nothing
      # about whether installing them leaves a machine the way it was found.
      # That gap is where the fleet's uninstall defects have lived: flyleaf
      # measured one on a real machine where the uninstaller reported success
      # and left an extension pointing at a program it had just deleted.
      #
      # This registers the real entries under HKCU and takes them away again, so
      # it belongs on a build agent rather than on a machine whose OpenDocument
      # associations are precious.
      - name: The integration installs, uninstalls, and leaves nothing behind
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/check-install.ps1

      # The `.ico` files, the package assets and the `.icns` files are committed
      # artefacts rather than build products, because nothing on Windows or macOS
      # rasterizes an SVG at build time and no resource compiler is in this
      # build. A committed artefact can fall out of step with the source it was
      # generated from and nothing would say so, so the generator is run and its
      # output compared against what is in the tree.
      #
      # The comparison is over whole directories rather than named files, because
      # an asset that drifted from its drawing would otherwise reach a store
      # listing with nothing having looked at it.
      - name: The committed icons and Store assets still match their generator
        run: |
          cargo run --manifest-path packaging/make-icons/Cargo.toml
          git diff --exit-code -- packaging/windows packaging/macos packaging/icons
