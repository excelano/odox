name: Linux

# Build the packages on a runner of each architecture, check them, and attach
# them to the release. `apt-ship` serves whatever `.deb`s are attached, so a
# release with nothing attached is one apt cannot serve.
#
# Nothing here reaches a window. What a machine can
# settle is that a package is well formed, declares its architecture, installs,
# and produces an executable this machine's loader accepts.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A release a workflow creates with the default GITHUB_TOKEN fires no event;
  # the dispatch below is the fallback for that case.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build packages for (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed by the tag when releasing and by the ref when checking, so a push to
  # main cannot cancel a release build.
  group: linux-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  # A superseded check is worth cancelling; a half-built release is not.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # The binaries, in one place: every step below iterates over this line.
  APPS: xodt xods xodp odox

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V && dpkg-deb --version | head -1

      - name: The three build scripts still agree
        run: test "$(md5sum crates/*/build.rs | awk '{print $1}' | sort -u | wc -l)" = 1

      - name: The catalogue template is current
        run: |
          sudo apt-get install -y -q gettext >/dev/null
          crates/odox-ui/po/update-po.sh --check

      # DESIGN.md §2: nothing compiled C and no development packages. `cargo tree
      # -i cc` cannot answer that, so this checks the outcome: no object file under
      # any build directory, and nothing linked at load time beyond libc, libgcc, libm.
      - name: Build, and nothing compiled C
        run: |
          cargo build --release --workspace
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          objects=$(find "${target}" -path '*/build/*' \( -name '*.o' -o -name '*.a' \) -print)
          [ -z "$objects" ] || { echo "a build script produced object files:"; echo "$objects"; exit 1; }

          # The dynamic loader is named for the architecture and lives in a
          # different directory on each: /lib64/ld-linux-x86-64.so.2 on amd64,
          # /lib/ld-linux-aarch64.so.1 on arm64. The allowlist in the repositories
          # this was cloned from had the amd64 path alone, so their first arm64
          # run reported the loader itself as an unexpected library.
          for app in $APPS; do
              echo "${app} links at load time:"
              ldd "${target}/release/${app}" | sed 's/^/  /'
              strange=$(ldd "${target}/release/${app}" | awk '{print $1}' |
                  grep -vE '^(linux-vdso|libgcc_s|libm|libc|/lib(64)?/ld-linux)' || true)
              [ -z "$strange" ] || { echo "unexpected shared libraries:"; echo "$strange"; exit 1; }
          done

      - name: Build the packages
        run: ./packaging/debian/build-deb.sh

      # A package labelled arm64 carrying an x86-64 executable installs and does not run.
      - name: Each package is the architecture it claims
        run: |
          for deb in dist/*.deb; do
              got=$(dpkg-deb -f "$deb" Architecture)
              echo "${deb}: ${got}"
              test "$got" = "${{ matrix.arch }}"
          done

      # One package per application per architecture; `commands` in `ship.conf`
      # is the list of applications.
      - name: There are as many packages as there are applications
        run: |
          expected=$(sed -n 's/^commands=//p' ship.conf | wc -w)
          found=$(ls dist/*.deb | wc -l)
          echo "expected ${expected}, found ${found}"
          test "$found" = "$expected"

      # Everything `root/root` and nothing carrying a mode a package should not
      # ship; `md5sums` present, which is what `dpkg -V` reads; and every
      # recorded hash agreeing with the file it names.
      - name: The packages hold up
        run: |
          for deb in dist/*.deb; do
              echo "checking ${deb}"

              strange=$(dpkg-deb --contents "$deb" | awk '$2 != "root/root"')
              [ -z "$strange" ] || { echo "not root/root:"; echo "$strange"; exit 1; }

              strange=$(dpkg-deb --contents "$deb" |
                  awk '$1 !~ /^drwxr-xr-x/ && $1 !~ /^-rw-r--r--/ && $1 !~ /^-rwxr-xr-x/')
              [ -z "$strange" ] || { echo "unexpected modes:"; echo "$strange"; exit 1; }

              dpkg-deb --ctrl-tarfile "$deb" | tar t | grep -qx './md5sums' ||
                  { echo "the package ships no md5sums" >&2; exit 1; }

              tree="${RUNNER_TEMP}/tree-$(basename "$deb" .deb)"
              dpkg-deb -x "$deb" "$tree"
              dpkg-deb -e "$deb" "${tree}/DEBIAN"
              ( cd "$tree" && md5sum -c DEBIAN/md5sums --quiet )
          done

      # `error,warning` so that no warning stands forever; `info` and `pedantic`
      # are suggestions rather than rules. There are no overrides.
      - name: What lintian says
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --info --tag-display-limit 0 --fail-on error,warning dist/*.deb

      # shared-mime-info declares the types; the desktop entries claim these
      # applications open them, and that claim is what this asks. Through `gio`,
      # because `xdg-mime` with no session falls back to `file`, which says zip.
      - name: The handlers are ours
        run: |
          # `xdg-utils` carries `xdg-mime`, which `install.sh --default` uses to
          # set the association. It is in the amd64 runner image and not in the
          # arm64 one, which is how the first run of this file failed on one
          # architecture and passed on the other — so it is installed rather
          # than assumed.
          sudo apt-get install -y -qq \
              shared-mime-info desktop-file-utils hicolor-icon-theme \
              libglib2.0-bin xdg-utils

          ./packaging/linux/install.sh --default

          set -- "text:corpus/libreoffice/text.odt:xodt" \
                 "spreadsheet:corpus/libreoffice/calc.ods:xods" \
                 "presentation:corpus/libreoffice/deck.odp:xodp"
          for case in "$@"; do
              kind=${case%%:*}; rest=${case#*:}; file=${rest%%:*}; app=${rest##*:}
              want="application/vnd.oasis.opendocument.${kind}"

              type=$(gio info -a standard::content-type "$file" |
                  sed -n 's/.*standard::content-type: //p')
              echo "${file}: ${type}"
              [ "$type" = "$want" ] || { echo "the type is not ${want}" >&2; exit 1; }

              handler=$(gio mime "$want" | sed -n 's/^Default application for .*: //p')
              echo "  default: ${handler}"
              [ "$handler" = "${app}.desktop" ] ||
                  { echo "the handler is not ${app}" >&2; exit 1; }
          done

      # Last, because it installs system-wide and the step above asks which handler
      # is registered. Each application opens a window from `main`, so what is asked
      # without a display is that the loader takes it and everything it links resolves.
      - name: They install, and what they installed loads
        run: |
          set -eu
          sudo apt-get install -y ./dist/*.deb

          for app in $APPS; do
              command -v "$app"
              file -L "$(command -v "$app")"

              missing=$(ldd "$(command -v "$app")" | grep 'not found' || true)
              [ -z "$missing" ] ||
                  { echo "${app} installed but does not resolve:"; echo "$missing"; exit 1; }

              out=$(timeout 20 "$app" 2>&1 || true)
              printf '%s\n' "$out" | sed "s/^/  ${app}: /"
              case "$out" in
                  *'error while loading shared libraries'*)
                      echo "the loader refused ${app}" >&2; exit 1 ;;
                  *'cannot execute binary file'*|*'Exec format error'*)
                      echo "${app} is not this machine's architecture" >&2; exit 1 ;;
              esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # Only on a release; a push builds the packages to check them and throws them away.
  attach:
    needs: package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -l packages
          gh release upload \
            "${{ github.event.release.tag_name || inputs.tag }}" \
            packages/*.deb --clobber
