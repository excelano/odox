# Version bump, dispatched by hand when it's time to prepare a release. See
# excelano/.github's version-bump.yml for the mechanics.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: version-bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor or major'
        required: true
        type: choice
        options: ['patch', 'minor', 'major']

jobs:
  bump:
    uses: excelano/.github/.github/workflows/version-bump.yml@main
    with:
      bump: ${{ inputs.bump }}
      manifest-paths: Cargo.toml
      workspace: true
      language: rust
    secrets: inherit
