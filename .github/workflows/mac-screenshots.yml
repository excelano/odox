# On-demand Store screenshots, Mac. Split from apple-silicon.yml so a
# screenshot dispatch doesn't build the test suite or the window-check it
# doesn't need - see excelano/.github's mac-screenshots.yml.
#
# One application per dispatch, unlike the Windows lane, which can take all
# three applications' frames in one run: the Mac lane assembles one bundle at
# a time and there is no "all three" shape for it to build here, so `app` is
# required rather than optional the way the original file's schema (loosely)
# allowed.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: screenshots (Mac)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'reference takes one plain frame; full takes the set.'
        required: true
        type: choice
        options: ['reference', 'full']
      app:
        description: 'Application to photograph: xodt, xods or xodp.'
        required: true
        type: choice
        options: ['xodt', 'xods', 'xodp']

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      app-path: ${{ steps.pick.outputs.app-path }}
    steps:
      - id: pick
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            xodt) echo "app-path=dist/Odox Text.app" >> "$GITHUB_OUTPUT" ;;
            xods) echo "app-path=dist/Odox Grid.app" >> "$GITHUB_OUTPUT" ;;
            xodp) echo "app-path=dist/Odox Deck.app" >> "$GITHUB_OUTPUT" ;;
          esac

  screenshots:
    needs: resolve
    uses: excelano/.github/.github/workflows/mac-screenshots.yml@main
    with:
      mode: ${{ inputs.mode }}
      app-path: ${{ needs.resolve.outputs.app-path }}
      # The bundle declares 11.0 and build-app.sh refuses a binary built for
      # another floor - same reasoning as apple-silicon.yml's own mac job.
      deployment-target: "11.0"
      # The bundle is the debug one no longer - this builds a release binary
      # for just the requested application. Building the whole workspace
      # keeps a later screenshots run of a different application a cache hit
      # rather than a full compile.
      pre-shot-script: |
        cargo build --release --workspace
        target=$(cargo metadata --format-version 1 --no-deps |
            sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
        ./packaging/macos/build-app.sh "${{ inputs.app }}" --binary "${target}/release/${{ inputs.app }}"
    secrets: inherit
