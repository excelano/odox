name: ci

# The checks themselves live in excelano/.github, so every Rust repo in the
# fleet runs the same ones and a correction reaches all of them at once. What
# stays here is when to run: that is this repo's business and the policy is the
# fleet's. See ~/notes/dry_boundary.md.
#
# The packaging checks are not here. They need a runner per architecture and
# they produce the artefacts a release attaches, so they live in `linux.yml`
# with the rest of this platform's arm.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-ci.yml@main
